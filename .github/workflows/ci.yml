name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  verify:
    name: ${{ matrix.os }} / Rust check, clippy, test & release bench
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - name: Checkout repository (zero third-party actions)
        run: |
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git fetch --depth=20 origin "${GITHUB_SHA}"
          git checkout --force FETCH_HEAD

      - name: Ensure stable Rust, rustfmt, clippy
        run: |
          rustup toolchain install stable --component rustfmt clippy
          rustup default stable
          rustc --version
          cargo --version

      - name: Check formatting
        run: cargo fmt --check

      - name: Verify #![forbid(unsafe_code)] & Clippy -D warnings
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Run unit, integration & security regression suite
        run: cargo test --all-targets --locked

      - name: Build stripped release binary & run 5,000-iteration benchmark
        run: |
          cargo build --release --locked
          ./target/release/substack-mcp-rs bench --iterations 5000

      - name: Validate architecture SVG
        run: xmllint --noout assets/architecture.svg
