name: Security Audit & Supply Chain

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: RustSec, Cargo Deny, Gitleaks & Binary Hardening Audit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository (zero third-party actions)
        run: |
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git fetch --depth=50 origin "${GITHUB_SHA}"
          git checkout --force FETCH_HEAD

      - name: Install RustSec (cargo-audit), cargo-deny & gitleaks
        run: |
          cargo install --locked cargo-audit cargo-deny
          brew install gitleaks || (
            curl -fsSL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz -o /tmp/gitleaks.tar.gz &&
            tar -xzf /tmp/gitleaks.tar.gz -C /usr/local/bin gitleaks
          )

      - name: Run cargo-audit (RustSec advisory scan)
        run: cargo audit

      - name: Run cargo-deny (advisories, bans, licenses, sources)
        run: cargo deny check

      - name: Run gitleaks secret scan across git history
        run: gitleaks detect --source . --verbose

      - name: Verify zero unsafe blocks in src/ and tests/
        run: |
          ! grep -rn "unsafe " src/ tests/ || (echo "Found disallowed unsafe keyword" && exit 1)
