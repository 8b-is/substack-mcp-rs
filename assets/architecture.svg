<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 640" role="img" aria-label="substack-mcp-rs Architecture: Agent-Agnostic MCP 2.0 + SSE + Small Editor Model + TurboFieldfare">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="accentOrange" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff6719"/>
      <stop offset="100%" stop-color="#fb923c"/>
    </linearGradient>
    <linearGradient id="accentCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="accentGreen" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
  </defs>

  <rect width="1160" height="640" rx="16" fill="url(#bg)"/>
  <rect x="20" y="20" width="1120" height="600" rx="12" fill="none" stroke="#1f2937" stroke-width="1.5"/>

  <text x="48" y="64" fill="#f9fafb" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="22" font-weight="700">substack-mcp-rs · Zero-Unsafe Rust MCP 2.0 + SSE Architecture</text>
  <text x="48" y="90" fill="#9ca3af" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14">Agent-Agnostic Server &amp; Client · Built-in Small Editor Model · TurboFieldfare .gturbo + Gemma 4 Loopback · Zero Attack Surface</text>

  <!-- Column 1: Agent Runtimes -->
  <rect x="44" y="122" width="236" height="466" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
  <rect x="44" y="122" width="236" height="5" rx="2.5" fill="url(#accentCyan)"/>
  <text x="64" y="154" fill="#38bdf8" font-family="ui-monospace, Menlo, monospace" font-size="15" font-weight="700">Agent Runtimes</text>
  <text x="64" y="176" fill="#94a3b8" font-family="ui-sans-serif, sans-serif" font-size="12">Any MCP-compatible client</text>

  <rect x="64" y="198" width="196" height="54" rx="7" fill="#172033" stroke="#1e3a5f"/>
  <text x="80" y="221" fill="#e2e8f0" font-family="ui-monospace, Menlo, monospace" font-size="12" font-weight="700">Claude / Cursor / Zed</text>
  <text x="80" y="240" fill="#94a3b8" font-family="ui-monospace, Menlo, monospace" font-size="11">MCP 2.0 + stdio</text>

  <rect x="64" y="266" width="196" height="54" rx="7" fill="#172033" stroke="#1e3a5f"/>
  <text x="80" y="289" fill="#e2e8f0" font-family="ui-monospace, Menlo, monospace" font-size="12" font-weight="700">OpenCode / Crush</text>
  <text x="80" y="308" fill="#94a3b8" font-family="ui-monospace, Menlo, monospace" font-size="11">Streamable HTTP (/mcp)</text>

  <rect x="64" y="334" width="196" height="54" rx="7" fill="#172033" stroke="#1e3a5f"/>
  <text x="80" y="357" fill="#e2e8f0" font-family="ui-monospace, Menlo, monospace" font-size="12" font-weight="700">Legacy SSE Agents</text>
  <text x="80" y="376" fill="#94a3b8" font-family="ui-monospace, Menlo, monospace" font-size="11">GET /sse + POST /message</text>

  <rect x="64" y="402" width="196" height="62" rx="7" fill="#0b1322" stroke="#10b981"/>
  <text x="80" y="425" fill="#34d399" font-family="ui-monospace, Menlo, monospace" font-size="12" font-weight="700">substack-mcp-rs client</text>
  <text x="80" y="445" fill="#cbd5e1" font-family="ui-monospace, Menlo, monospace" font-size="11">Pure-Rust MCP 2.0 CLI</text>

  <rect x="64" y="482" width="196" height="84" rx="7" fill="#1e1b2e" stroke="#4c1d95"/>
  <text x="80" y="505" fill="#c4b5fd" font-family="ui-monospace, Menlo, monospace" font-size="12" font-weight="700">Local CLI Utilities</text>
  <text x="80" y="525" fill="#cbd5e1" font-family="ui-monospace, Menlo, monospace" font-size="11">editor analyze / polish</text>
  <text x="80" y="543" fill="#cbd5e1" font-family="ui-monospace, Menlo, monospace" font-size="11">verify-gturbo / bench</text>

  <!-- Column 2: Security Middleware & Core Server -->
  <rect x="316" y="122" width="464" height="466" rx="10" fill="#0f172a" stroke="#10b981" stroke-width="1.5"/>
  <rect x="316" y="122" width="464" height="5" rx="2.5" fill="url(#accentGreen)"/>
  <text x="340" y="154" fill="#34d399" font-family="ui-monospace, Menlo, monospace" font-size="15" font-weight="700">Hardened MCP 2.0 Core (#![forbid(unsafe_code)])</text>
  <text x="340" y="176" fill="#94a3b8" font-family="ui-sans-serif, sans-serif" font-size="12">rmcp 3.11.0 + Axum 0.8.9 + Tower + Pure-Rust Zero-Allocation Paths</text>

  <rect x="340" y="196" width="416" height="106" rx="8" fill="#132524" stroke="#10b981"/>
  <text x="358" y="220" fill="#6ee7b7" font-family="ui-monospace, Menlo, monospace" font-size="13" font-weight="700">Transport &amp; Zero-Attack-Surface Security Layer</text>
  <text x="358" y="242" fill="#e2e8f0" font-family="ui-monospace, Menlo, monospace" font-size="11">Host Rebinding Guard · Origin CSWSH Check · Constant-Time Bearer Auth</text>
  <text x="358" y="261" fill="#e2e8f0" font-family="ui-monospace, Menlo, monospace" font-size="11">2 MiB Body Limit · 128 Concurrency Cap · 64 Bounded SSE Sessions</text>
  <text x="358" y="280" fill="#cbd5e1" font-family="ui-monospace, Menlo, monospace" font-size="11">Strict Headers: nosniff | no-store | X-Frame-Options: DENY | CSP none</text>

  <rect x="340" y="318" width="416" height="122" rx="8" fill="#172033" stroke="#38bdf8"/>
  <text x="358" y="342" fill="#38bdf8" font-family="ui-monospace, Menlo, monospace" font-size="13" font-weight="700">Built-In Pure-Rust Small Editor Model</text>
  <text x="358" y="364" fill="#e2e8f0" font-family="ui-monospace, Menlo, monospace" font-size="11">Single-Pass pulldown-cmark -&gt; Substack ProseMirror AST Compiler</text>
  <text x="358" y="383" fill="#e2e8f0" font-family="ui-monospace, Menlo, monospace" font-size="11">Drops Raw HTML &amp; Neutralizes javascript:/data:/file: XSS Links</text>
  <text x="358" y="402" fill="#cbd5e1" font-family="ui-monospace, Menlo, monospace" font-size="11">Flesch-Kincaid Grade · Read Time · AI-Cliche Linter · Code-Safe Polish</text>
  <text x="358" y="421" fill="#94a3b8" font-family="ui-monospace, Menlo, monospace" font-size="11">Deterministic &amp; Zero-Network (&lt; 25 us/doc)</text>

  <rect x="340" y="456" width="416" height="110" rx="8" fill="#1e1b2e" stroke="#a855f7"/>
  <text x="358" y="480" fill="#d8b4fe" font-family="ui-monospace, Menlo, monospace" font-size="13" font-weight="700">11 MCP Tools · 2 Prompts · 2 Resources</text>
  <text x="358" y="502" fill="#e2e8f0" font-family="ui-monospace, Menlo, monospace" font-size="11">substack_{verify_session,list_drafts,get_draft,create_draft,update_draft}</text>
  <text x="358" y="521" fill="#e2e8f0" font-family="ui-monospace, Menlo, monospace" font-size="11">substack_{publish_draft [DUAL-GATED], list_posts}</text>
  <text x="358" y="540" fill="#cbd5e1" font-family="ui-monospace, Menlo, monospace" font-size="11">editor_{analyze_markdown,to_prosemirror,refine_draft} · turbo_verify_gturbo</text>

  <!-- Column 3: Verified External Boundaries -->
  <rect x="816" y="122" width="300" height="466" rx="10" fill="#0f172a" stroke="#ff6719" stroke-width="1.5"/>
  <rect x="816" y="122" width="300" height="5" rx="2.5" fill="url(#accentOrange)"/>
  <text x="838" y="154" fill="#fb923c" font-family="ui-monospace, Menlo, monospace" font-size="15" font-weight="700">Verified Boundaries</text>
  <text x="838" y="176" fill="#94a3b8" font-family="ui-sans-serif, sans-serif" font-size="12">Zero-SSRF · Zero Redirects · Zeroize</text>

  <rect x="838" y="198" width="256" height="176" rx="8" fill="#1f1712" stroke="#ff6719"/>
  <text x="854" y="222" fill="#fb923c" font-family="ui-monospace, Menlo, monospace" font-size="13" font-weight="700">Substack API Client</text>
  <text x="854" y="244" fill="#e2e8f0" font-family="ui-monospace, Menlo, monospace" font-size="11">rustls + HTTP/2 (Zero OpenSSL)</text>
  <text x="854" y="264" fill="#e2e8f0" font-family="ui-monospace, Menlo, monospace" font-size="11">Strict ASCII Subdomain Allowlist</text>
  <text x="854" y="284" fill="#e2e8f0" font-family="ui-monospace, Menlo, monospace" font-size="11">SecretCookie(Zeroizing) [REDACTED]</text>
  <text x="854" y="304" fill="#cbd5e1" font-family="ui-monospace, Menlo, monospace" font-size="11">Policy::none() · 4 MiB Resp Cap</text>
  <text x="854" y="324" fill="#cbd5e1" font-family="ui-monospace, Menlo, monospace" font-size="11">Dual-Gate Publish Lock Default ON</text>
  <text x="854" y="344" fill="#94a3b8" font-family="ui-monospace, Menlo, monospace" font-size="11">https://&lt;pub&gt;.substack.com/api/v1</text>

  <rect x="838" y="392" width="256" height="174" rx="8" fill="#131c2e" stroke="#38bdf8"/>
  <text x="854" y="416" fill="#38bdf8" font-family="ui-monospace, Menlo, monospace" font-size="13" font-weight="700">drumih/turbo-fieldfare</text>
  <text x="854" y="438" fill="#e2e8f0" font-family="ui-monospace, Menlo, monospace" font-size="11">Loopback-Only /v1/chat/completions</text>
  <text x="854" y="458" fill="#e2e8f0" font-family="ui-monospace, Menlo, monospace" font-size="11">Gemma 4 26B-A4B (~2 GB M-Series RAM)</text>
  <text x="854" y="478" fill="#e2e8f0" font-family="ui-monospace, Menlo, monospace" font-size="11">Prompt-Injection Tag Isolation</text>
  <text x="854" y="498" fill="#cbd5e1" font-family="ui-monospace, Menlo, monospace" font-size="11">.gturbo Symlink &amp; Traversal Guard</text>
  <text x="854" y="518" fill="#cbd5e1" font-family="ui-monospace, Menlo, monospace" font-size="11">64 KiB Streaming SHA-256 Receipt</text>
  <text x="854" y="538" fill="#94a3b8" font-family="ui-monospace, Menlo, monospace" font-size="11">Automatic Offline Small-Editor Fallback</text>

