[graph]
all-features = true

[advisories]
version = 2
ignore = [
  # Transitive via rmcp 3.11.0 (not used by substack-mcp-rs directly); informational unmaintained
  # notice (no CVE / no exploit). Track rmcp upstream migration to jiff/time.
  { id = "RUSTSEC-2026-0543", reason = "transitive via rmcp 3.11.0; no CVE, tracking upstream migration" },
]

[licenses]
version = 2
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "MIT",
  "BSD-3-Clause",
  "ISC",
  "Unicode-3.0",
  "CDLA-Permissive-2.0",
  "CC0-1.0",
  "Zlib",
]
confidence-threshold = 0.8

[bans]
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"
deny = [
  { name = "openssl" },
  { name = "openssl-sys" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
